name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y liblcms2-2
      - run: npm ci --legacy-peer-deps
      - run: pip install -r server/requirements-dev.txt
      - run: npm run check
        env:
          VITE_BASE_PATH: /chromablind/
      - run: python -m pytest server -q
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify GitHub Pages build
        run: |
          VITE_BASE_PATH=/chromablind/ npx vite preview --host 127.0.0.1 --port 4173 > /tmp/chromablind-pages.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/chromablind/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-pages.mjs
      - name: Browser scenarios with local export service
        run: |
          python -m uvicorn server.app:app --host 127.0.0.1 --port 8000 > /tmp/chromablind-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: chromablind-build
          path: dist/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chromablind-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
