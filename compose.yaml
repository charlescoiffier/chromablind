services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped
